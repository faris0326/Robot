; Encoder / RPM test for the line follower (standalone project, separate from
; the robot firmware in the parent folder).
;
;   cd rpmtest
;   pio run -t upload -t monitor
;
; Type commands in the monitor and press Enter (see the help text on boot).

[env:rpmtest]
platform = espressif32@6.13.0          ; Arduino core 2.0.17, same as the robot
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM

monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter
