; Line follower robot — YD ESP32-S3 N16R8 (16 MB flash, 8 MB octal PSRAM)
;
;   pio run -t upload -t monitor                   normal run (line following)
;   pio run -e sensortest -t upload -t monitor     print IR bits/position, motors off
;   pio run -e steertest -t upload -t monitor      control live, wheels lifted, prints L/R
;   pio run -e motortest -t upload -t monitor      Phase 1 motor test
;   pio run -e enctest -t upload -t monitor        encoder counts (turn the wheels by hand)
;   pio run -e robot_ota -t upload                 normal run, over Wi-Fi (join the robot's
;                                                  Wi-Fi first; needs firmware with OTA on it)

[platformio]
default_envs = robot

; Over-the-air uploads. The password is built into the firmware and given
; to the uploader, so only someone with this file can flash the robot.
[ota]
password = NIP5G0lql7igc3X3

[env]
platform = espressif32@6.13.0          ; Arduino core 2.0.17
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
    -DOTA_PASSWORD=\"${ota.password}\"

lib_deps =
    links2004/WebSockets@^2.6.1

; The phone page, served from flash (edit web/index.html, then rebuild)
board_build.embed_txtfiles =
    web/index.html

[env:robot]

; Same firmware as robot, uploaded over Wi-Fi to the robot's access point.
[env:robot_ota]
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --port=3232
    --auth=${ota.password}

[env:sensortest]
build_flags = ${env.build_flags} -DSENSOR_TEST

[env:steertest]
build_flags = ${env.build_flags} -DSTEER_TEST

[env:motortest]
build_flags = ${env.build_flags} -DMOTOR_TEST

[env:enctest]
build_flags = ${env.build_flags} -DENCODER_TEST
