; Copy this file to secrets.ini (same folder) and set your own passwords.
; secrets.ini is in .gitignore, so the real passwords never reach GitHub.
[secrets]
; Wi-Fi password of the robot's access point (8..63 characters)
wifi_password = change-me-please
; Over-the-air upload password (built into the firmware, given to the uploader)
ota_password = change-me-too
